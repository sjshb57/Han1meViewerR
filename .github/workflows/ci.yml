name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ feat/new_download ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystore
        if: env.STORE_FILE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$STORE_FILE_BASE64" | base64 -d > keystore/Han1meViewerKeystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all APK variants
        run: |
          ./gradlew assembleDebug assembleRelease assembleReleaseNoObfuscate

      - name: List all APK files
        run: |
          echo "===== 所有APK文件 ====="
          find app/build/outputs -name "*.apk" -exec ls -la {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK (Obfuscated)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-obfuscated
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release APK (No Obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-no-obfuscate
          path: app/build/outputs/apk/releaseNoObfuscate/*.apk
          retention-days: 30